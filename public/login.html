<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Task Agent — 登录</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; color: #1a1a2e;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p { color: #6b7280; font-size: .88rem; margin-bottom: 24px; }
    label { display: block; font-size: .84rem; font-weight: 600; margin-bottom: 4px; color: #374151; }
    input {
      width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db;
      border-radius: 10px; font-size: .95rem; margin-bottom: 16px;
      outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #2563eb; }
    button {
      width: 100%; padding: 12px; background: #2563eb; color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .error { color: #e11d48; font-size: .84rem; margin-bottom: 12px; display: none; }
    .error.show { display: block; }
    .hint { margin-top: 16px; font-size: .78rem; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
<div class="card">
  <h1>WhatsApp Task Agent</h1>
  <p>请输入密码访问 Dashboard</p>
  <div class="error" id="error">用户名或密码错误</div>
  <form id="login-form">
    <label for="username">用户名</label>
    <input id="username" type="text" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="btn">登录</button>
  </form>
  <p class="hint">环境变量 AUTH_PASSWORD 未设置时为免登模式</p>
</div>
<script>
const API = window.location.origin;
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('error');
  btn.disabled = true; btn.textContent = '登录中...';
  err.classList.remove('show');
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    if (!r.ok) { err.classList.add('show'); btn.disabled = false; btn.textContent = '登录'; return; }
    const data = await r.json();
    localStorage.setItem('auth_token', data.token);
    window.location.href = '/dashboard.html';
  } catch {
    err.textContent = '网络错误，请重试';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = '登录';
  }
});
</script>
</body>
</html>
