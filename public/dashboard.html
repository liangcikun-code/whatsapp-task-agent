<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Task Agent — Dashboard</title>
  <style>
    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fb;
      --surface: #ffffff;
      --surface-hover: #fafbfc;
      --border: #eaeaed;
      --border-strong: #d4d4d8;
      --text: #111113;
      --text-secondary: #5f5f66;
      --text-tertiary: #8e8e93;
      --brand: #2563eb;
      --brand-light: #eff6ff;
      --brand-hover: #1d4ed8;
      --high: #e11d48;
      --high-bg: #fff1f2;
      --medium: #d97706;
      --medium-bg: #fffbeb;
      --low: #059669;
      --low-bg: #ecfdf5;
      --success: #059669;
      --success-light: #d1fae5;
      --done: #8e8e93;
      --done-bg: #f8f9fb;
      --overdue: #e11d48;
      --overdue-bg: #fff1f2;
      --radius: 14px;
      --radius-sm: 9px;
      --radius-xs: 6px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,.03);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.03);
      --shadow: 0 4px 12px rgba(0,0,0,.05);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.1);
      --transition: 180ms ease;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Layout ===== */
    .shell {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: .7rem; font-weight: 600; letter-spacing: .02em;
      color: var(--brand);
      background: var(--brand-light);
    }
    .health-indicator {
      display: flex; align-items: center; gap: 7px;
      font-size: .78rem; font-weight: 500;
      color: var(--text-tertiary);
    }
    .health-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--low);
      box-shadow: 0 0 0 3px var(--low-bg);
    }
    .health-dot.off { background: var(--high); box-shadow: 0 0 0 3px var(--high-bg); }

    /* ===== Stat Cards ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px;
      transition: box-shadow var(--transition);
    }
    .stat:hover { box-shadow: var(--shadow-sm); }
    .stat .label {
      font-size: .7rem; font-weight: 600; letter-spacing: .05em;
      color: var(--text-tertiary); text-transform: uppercase;
    }
    .stat .value {
      font-size: 1.9rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
    }
    .stat .sub {
      font-size: .7rem; color: var(--text-tertiary); margin-top: 2px;
    }
    @media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } }

    /* ===== Settings Panel ===== */
    .settings-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      margin-bottom: 28px;
      box-shadow: var(--shadow-xs);
      overflow: hidden;
    }
    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 22px;
      cursor: pointer;
      user-select: none;
    }
    .settings-header:hover { background: var(--surface-hover); }
    .settings-header h3 { font-size: .85rem; font-weight: 700; letter-spacing: -0.01em; }
    .settings-body { padding: 0 22px 18px; display: none; }
    .settings-body.open { display: block; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: .85rem; font-weight: 500; }
    .toggle-hint { font-size: .72rem; color: var(--text-tertiary); }
    .switch {
      position: relative; width: 42px; height: 24px; flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0;
      background: #d1d5db; border-radius: 100px;
      cursor: pointer; transition: background var(--transition);
    }
    .switch .slider::after {
      content: ''; position: absolute;
      width: 18px; height: 18px; left: 3px; top: 3px;
      background: white; border-radius: 50%;
      transition: transform var(--transition);
    }
    .switch input:checked + .slider { background: var(--brand); }
    .switch input:checked + .slider::after { transform: translateX(18px); }

    /* ===== Tabs ===== */
    .tab-bar {
      display: flex; gap: 2px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 4px;
      margin-bottom: 20px; box-shadow: var(--shadow-xs);
    }
    .tab {
      flex: 1; padding: 9px 14px; border: none; background: transparent;
      border-radius: 7px; font-size: .8rem; font-weight: 600;
      cursor: pointer; color: var(--text-secondary);
      transition: all var(--transition); white-space: nowrap;
    }
    .tab.active { background: var(--text); color: white; }
    .tab:hover:not(.active) { color: var(--text); }

    .filter-row {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      justify-content: space-between; margin-bottom: 20px;
    }
    .filter-row select {
      padding: 8px 14px; border: 1px solid var(--border);
      border-radius: var(--radius-xs); font-size: .8rem;
      background: var(--surface); color: var(--text); cursor: pointer;
      font-weight: 500;
    }

    /* ===== Buttons ===== */
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      padding: 9px 18px; border: none; border-radius: var(--radius-xs);
      font-size: .8rem; font-weight: 600; cursor: pointer;
      transition: all var(--transition); display: inline-flex;
      align-items: center; gap: 6px; font-family: inherit;
    }
    .btn-primary { background: var(--brand); color: white; }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-ghost {
      background: var(--surface); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg); }
    .btn-sm { padding: 6px 12px; font-size: .75rem; }

    /* ===== Priority Groups ===== */
    .priority-group { margin-bottom: 28px; }
    .priority-group h2 {
      font-size: .72rem; font-weight: 700; letter-spacing: .06em;
      color: var(--text-tertiary); margin-bottom: 10px; padding-left: 4px;
      text-transform: uppercase;
    }
    .priority-group h2 .count { font-weight: 500; }

    /* ===== Task Row ===== */
    .task-row {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 18px; margin: 3px 0;
      border-radius: var(--radius-sm);
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.15s;
    }
    .task-row:hover { box-shadow: var(--shadow-sm); border-color: var(--border-strong); }

    .priority-stripe {
      width: 3px; min-height: 34px; border-radius: 3px;
      flex-shrink: 0; align-self: stretch;
    }
    .priority-stripe.high { background: var(--high); }
    .priority-stripe.medium { background: var(--medium); }
    .priority-stripe.low { background: var(--low); }

    .custom-check {
      width: 20px; height: 20px; border-radius: 5px;
      border: 2px solid var(--border-strong);
      flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; font-size: 0.65rem;
      color: transparent; transition: all 0.15s;
      margin-top: 1px; pointer-events: none;
    }
    .task-row.checked .custom-check {
      background: var(--success); border-color: var(--success); color: #fff;
    }

    .task-body { flex: 1; min-width: 0; }
    .task-title {
      font-size: .9rem; font-weight: 600; word-break: break-word;
      color: var(--text);
    }
    .task-row.checked .task-title {
      text-decoration: line-through; color: var(--done);
    }
    .task-row.checked .task-body { opacity: .55; }

    .task-meta {
      display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
      font-size: .72rem; color: var(--text-tertiary); margin-top: 5px;
    }
    .tag {
      padding: 2px 8px; border-radius: 100px;
      font-weight: 600; font-size: .65rem; letter-spacing: .02em;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .tag-p-high { background: var(--high-bg); color: var(--high); }
    .tag-p-medium { background: var(--medium-bg); color: var(--medium); }
    .tag-p-low { background: var(--low-bg); color: var(--low); }
    .tag-overdue { background: var(--overdue-bg); color: var(--overdue); font-weight: 700; }
    .tag-done { background: var(--success-light); color: var(--success); }
    .tag-action {
      background: transparent; color: var(--text-tertiary);
      border: 1px dashed var(--border);
      cursor: pointer; font-size: .63rem; padding: 2px 8px;
    }
    .tag-action:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
    .task-note {
      font-size: .72rem; color: var(--text-secondary);
      max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; display: inline-flex; align-items: center; gap: 3px;
    }
    .task-id-tag {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: .65rem; color: var(--text-tertiary); opacity: .5;
      letter-spacing: -0.01em;
    }

    .task-row .del-btn {
      width: 28px; height: 28px; border: 1px solid transparent;
      border-radius: var(--radius-xs); background: transparent;
      cursor: pointer; display: grid; place-items: center;
      font-size: .8rem; color: transparent; transition: all 0.15s;
      flex-shrink: 0;
    }
    .task-row:hover .del-btn { color: var(--text-tertiary); border-color: var(--border); }
    .task-row .del-btn:hover { background: var(--high-bg); color: var(--high); border-color: var(--high); }

    /* ===== Modal ===== */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.25); backdrop-filter: blur(6px);
      display: grid; place-items: center; z-index: 100; padding: 20px;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: var(--surface); border-radius: var(--radius);
      padding: 32px; width: 100%; max-width: 420px;
      box-shadow: var(--shadow-lg);
      animation: slideUp .2s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .modal h2 {
      font-size: 1.05rem; font-weight: 700; margin-bottom: 22px;
      letter-spacing: -0.01em;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block; font-size: .72rem; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 5px;
      letter-spacing: .02em; text-transform: uppercase;
    }
    .field input, .field textarea, .field select {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: var(--radius-xs);
      font-size: .85rem; font-family: inherit; color: var(--text);
      background: var(--surface); transition: all var(--transition);
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: none; border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-light);
    }
    .field textarea { resize: vertical; min-height: 64px; }

    /* ===== Date Picker Dropdown ===== */
    .dp-backdrop {
      display: none; position: fixed; inset: 0; z-index: 140;
      background: rgba(0,0,0,.2);
    }
    .dp-backdrop.show { display: block; }
    .date-picker-dropdown {
      display: none; position: fixed; z-index: 150;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,.15);
      padding: 24px; min-width: 280px;
    }
    .date-picker-dropdown.show { display: block; }
    .date-picker-dropdown input[type="date"] {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: var(--radius-xs);
      font-size: .85rem; font-family: inherit;
    }
    .date-picker-dropdown .dp-actions {
      display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px;
    }
    .dp-actions .btn { padding: 6px 14px; font-size: .75rem; }
    .modal .btn-row {
      display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: var(--text); color: white;
      padding: 14px 24px; border-radius: var(--radius-sm);
      font-size: .85rem; font-weight: 600; z-index: 200;
      opacity: 0; transform: translateY(8px);
      transition: all 250ms ease; pointer-events: auto;
      box-shadow: var(--shadow-lg);
      cursor: pointer;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast:not(.show) { pointer-events: none; }

    /* ===== Empty State ===== */
    .empty {
      text-align: center; padding: 60px 20px; color: var(--text-tertiary);
      background: var(--surface); border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
    .empty .icon { font-size: 2.2rem; margin-bottom: 10px; opacity: .6; }
    .empty p { font-size: .85rem; }

    /* ===== Spinner ===== */
    .spinner {
      width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin .6s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .shell { padding: 20px 14px 60px; }
      .task-row { flex-wrap: wrap; }
      .task-row .del-btn { color: var(--text-tertiary); border-color: var(--border); }
      .header { flex-direction: column; align-items: flex-start; }
      .tab-bar { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>WhatsApp Task Agent</h1>
        <span class="header-badge">Dashboard</span>
      </div>
      <div class="health-indicator">
        <span class="health-dot" id="health-dot"></span>
        <span id="health-text">连接中…</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Schedule Settings -->
    <div class="settings-panel">
      <div class="settings-header" onclick="toggleSettings()">
        <h3>日程提醒配置</h3>
        <span style="font-size:.75rem;color:var(--text-tertiary)" id="settings-arrow">▸</span>
      </div>
      <div class="settings-body" id="settings-body">
        <div id="toggle-list"></div>
      </div>
    </div>

    <!-- Tabs & Actions -->
    <div class="tab-bar" id="tabs"></div>
    <div class="filter-row">
      <select id="priority-filter">
        <option value="">全部优先级</option>
        <option value="high">高优先级</option>
        <option value="medium">中优先级</option>
        <option value="low">低优先级</option>
      </select>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" onclick="refreshTasks()" id="refresh-btn">刷新</button>
        <button class="btn btn-primary" onclick="openCreateModal()">+ 新建任务</button>
      </div>
    </div>

    <!-- Task List -->
    <div id="task-list"></div>

    <!-- Create/Edit Modal -->
    <div class="overlay hidden" id="modal-overlay">
      <div class="modal">
        <h2 id="modal-title">新建任务</h2>
        <form id="task-form" onsubmit="submitTask(event)">
          <input type="hidden" id="task-id">
          <div class="field">
            <label for="title">任务标题</label>
            <input type="text" id="title" placeholder="输入任务名称…" required autocomplete="off">
          </div>
          <div class="field" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <div>
              <label for="priority">优先级</label>
              <select id="priority">
                <option value="medium">中</option>
                <option value="high">高</option>
                <option value="low">低</option>
              </select>
            </div>
            <div>
              <label for="deadline">截止日期</label>
              <input type="datetime-local" id="deadline">
            </div>
          </div>
          <div class="field">
            <label for="sourceName">来源</label>
            <input type="text" id="sourceName" placeholder="谁发起的任务…">
          </div>
          <div class="field">
            <label for="comment">备注</label>
            <textarea id="comment" placeholder="补充说明…" rows="2"></textarea>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">取消</button>
            <button type="submit" class="btn btn-primary" id="submit-btn">创建任务</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Date Picker Dropdown -->
    <div class="dp-backdrop" id="dp-backdrop"></div>
    <div class="date-picker-dropdown" id="date-picker-dd">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <span style="font-size:.8rem;font-weight:700">截止日期</span>
        <button onclick="closeDatePicker()" style="background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-tertiary);padding:0;line-height:1">&times;</button>
      </div>
      <input type="date" id="date-picker-input">
      <div class="dp-actions">
        <button class="btn btn-ghost btn-sm" onclick="closeDatePicker()">取消</button>
        <button class="btn btn-primary btn-sm" onclick="saveDatePicker()">确定</button>
      </div>
    </div>
  </div>

  <script>
    // ===================== State =====================
    const API = '';
    let tasks = [];
    let stats = {};
    let scheduleConfig = {};
    let statusTab = '';
    let priorityFilter = '';
    let toggling = false;

    // ===================== Init =====================
    async function init() {
      await Promise.all([checkHealth(), loadScheduleConfig(), loadTasks()]);
      setupTabs();
      setupPriorityFilter();
      buildToggleList();
    }

    // ===================== Health =====================
    async function checkHealth() {
      const dot = document.getElementById('health-dot');
      const text = document.getElementById('health-text');
      try {
        const r = await fetch(API + '/api/health');
        if (r.ok) { dot.classList.remove('off'); text.textContent = 'API 在线'; }
        else { dot.classList.add('off'); text.textContent = 'API 异常'; }
      } catch {
        dot.classList.add('off'); text.textContent = 'API 离线';
      }
    }

    // ===================== Settings =====================
    function toggleSettings() {
      const body = document.getElementById('settings-body');
      const arrow = document.getElementById('settings-arrow');
      body.classList.toggle('open');
      arrow.textContent = body.classList.contains('open') ? '▾' : '▸';
    }

    async function loadScheduleConfig() {
      try {
        const r = await fetch(API + '/api/schedule/config');
        scheduleConfig = await r.json();
      } catch {
        scheduleConfig = { morningReport: true, eveningReport: false, weeklyReport: true, monthlyReport: false };
      }
    }

    function buildToggleList() {
      const items = [
        { key: 'morningReport', label: '每日早报', hint: '09:00 — 今日到期 + 逾期提醒' },
        { key: 'eveningReport', label: '每日晚报', hint: '21:00 — 今日创建 + 明日待办' },
        { key: 'weeklyReport', label: '周报', hint: '周日 20:00 — 本周完成率 + 下周待办' },
        { key: 'monthlyReport', label: '月报', hint: '次月 1 号 20:00 — 月度回顾 + 趋势' },
      ];
      document.getElementById('toggle-list').innerHTML = items.map(i => `
        <div class="toggle-row">
          <div>
            <div class="toggle-label">${i.label}</div>
            <div class="toggle-hint">${i.hint}</div>
          </div>
          <label class="switch">
            <input type="checkbox" ${scheduleConfig[i.key] ? 'checked' : ''}
                   onchange="toggleSchedule('${i.key}', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      `).join('');
    }

    async function toggleSchedule(key, value) {
      try {
        const r = await fetch(API + '/api/schedule/config', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ [key]: value }),
        });
        scheduleConfig = await r.json();
        toast(`${labelFor(key)} ${value ? '已开启' : '已关闭'}`);
      } catch {
        toast('更新失败');
        buildToggleList();
      }
    }

    function labelFor(key) {
      const map = { morningReport: '每日早报', eveningReport: '每日晚报', weeklyReport: '周报', monthlyReport: '月报' };
      return map[key] || key;
    }

    // ===================== Tasks =====================
    async function loadTasks() {
      const btn = document.getElementById('refresh-btn');
      btn.innerHTML = '<span class="spinner"></span> 加载中';
      try {
        let url = API + '/api/tasks?';
        if (statusTab) url += 'status=' + statusTab + '&';
        if (priorityFilter) url += 'priority=' + priorityFilter + '&';
        const r = await fetch(url);
        const data = await r.json();
        tasks = data.tasks || [];
        stats = data.stats || { total: 0, done: 0, pending: 0 };
        renderStats();
        renderTasks();
      } catch { toast('加载失败'); }
      finally { btn.innerHTML = '刷新'; }
    }

    function refreshTasks() { loadTasks(); }

    // ===================== Stats =====================
    function renderStats() {
      const overdue = tasks.filter(t => t.status !== 'done' && t.deadline && new Date(t.deadline) < new Date()).length;
      const rate = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="label">全部</div><div class="value">${stats.total || 0}</div></div>
        <div class="stat"><div class="label">待办</div><div class="value">${stats.pending || 0}</div></div>
        <div class="stat"><div class="label">已完成</div><div class="value">${stats.done || 0}</div><div class="sub">完成率 ${rate}%</div></div>
        <div class="stat"><div class="label">逾期</div><div class="value" style="color:var(--overdue)">${overdue}</div></div>
      `;
    }

    // ===================== Tabs =====================
    function setupTabs() {
      const tabs = [
        { key: '', label: '全部' },
        { key: 'pending', label: '待办' },
        { key: 'done', label: '已完成' },
      ];
      document.getElementById('tabs').innerHTML = tabs.map(t => `
        <button class="tab ${statusTab === t.key ? 'active' : ''}" onclick="switchTab('${t.key}')">${t.label}</button>
      `).join('');
    }

    function switchTab(key) { statusTab = key; setupTabs(); loadTasks(); }

    function setupPriorityFilter() {
      document.getElementById('priority-filter').value = priorityFilter;
      document.getElementById('priority-filter').onchange = e => { priorityFilter = e.target.value; loadTasks(); };
    }

    // ===================== Render Tasks =====================
    function renderTasks() {
      const c = document.getElementById('task-list');
      if (tasks.length === 0) {
        c.innerHTML = `<div class="empty"><div class="icon">&#x25A1;</div><p>${statusTab === 'done' ? '还没有完成的任务' : '暂无任务'}</p></div>`;
        return;
      }

      const groups = { high: [], medium: [], low: [] };
      tasks.forEach(t => { const g = groups[t.priority] || groups['medium']; g.push(t); });
      const order = ['high', 'medium', 'low'];
      const labels = { high: '高优先级', medium: '中优先级', low: '低优先级' };

      let html = '';
      order.forEach(p => {
        const list = groups[p];
        if (!list || !list.length) return;
        html += `<div class="priority-group"><h2>${labels[p]} <span class="count">&#xB7; ${list.length}</span></h2>`;
        list.forEach(t => html += taskRow(t));
        html += '</div>';
      });
      c.innerHTML = html;
    }

    function taskRow(t) {
      const isOverdue = t.status === 'pending' && t.deadline && new Date(t.deadline) < new Date();
      const isDone = t.status === 'done';
      const deadlineStr = t.deadline ? fmtDate(t.deadline) : '';
      const createdStr = fmtDate(t.createdAt);

      let meta = '';
      if (isDone) {
        meta += `<span class="tag tag-done">已完成</span>`;
      } else {
        meta += `<span class="tag tag-p-${t.priority}">${priLabel(t.priority)}</span>`;
      }
      if (deadlineStr) {
        meta += `<span>${deadlineStr}</span>`;
        if (isOverdue) meta += `<span class="tag tag-overdue">逾期</span>`;
      } else if (!isDone) {
        meta += `<span class="tag tag-action" onclick="event.stopPropagation();showDatePicker('${t.id}')">+ 截止日</span>`;
      }
      meta += `<span>${createdStr}</span>`;
      // 来源：优先显示 name，有 phone 时追加显示
      if (t.sourceName || t.sourceChat) {
        const parts = [];
        if (t.sourceName && t.sourceName !== t.sourceChat) parts.push(esc(t.sourceName));
        if (t.sourceChat) parts.push(esc(t.sourceChat));
        if (parts.length > 0) {
          meta += `<span style="color:var(--text-tertiary);font-size:.68rem">${parts.join(' / ')}</span>`;
        }
      }
      if (t.description) {
        meta += `<span class="task-note" title="${esc(t.description)}">${esc(t.description)}</span>`;
      } else if (!isDone) {
        meta += `<span class="tag tag-action" onclick="event.stopPropagation();quickAddNote('${t.id}')">+ 备注</span>`;
      }
      meta += `<span class="task-id-tag">#${t.id}</span>`;
      meta += `<span class="tag tag-action" style="border-style:solid;opacity:.5" onclick="event.stopPropagation();openEditModal('${t.id}')">编辑</span>`;

      return `
        <div class="task-row ${isDone ? 'checked' : ''}" onclick="toggleTask('${t.id}', this)" data-id="${t.id}">
          <div class="priority-stripe ${t.priority}"></div>
          <div class="custom-check">&#x2713;</div>
          <div class="task-body">
            <div class="task-title">${esc(t.title)}</div>
            <div class="task-meta">${meta}</div>
          </div>
          <button class="del-btn" title="删除" onclick="event.stopPropagation();deleteTask('${t.id}')">&#x2715;</button>
        </div>`;
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return '今天 ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      const tmr = new Date(now); tmr.setDate(tmr.getDate()+1);
      if (d.toDateString() === tmr.toDateString()) return '明天 ' + d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      const diff = Math.ceil((d - now) / (1000*60*60*24));
      if (diff > 0 && diff <= 7) return `${diff}天后`;
      if (diff < 0 && diff >= -1) return '昨天';
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function priLabel(p) { return { high:'高', medium:'中', low:'低' }[p]||p; }

    // ===================== Toggle =====================
    async function toggleTask(id, rowEl) {
      if (toggling) return;
      toggling = true;
      const isDone = rowEl.classList.contains('checked');
      const endpoint = isDone ? 'undone' : 'done';

      // Optimistic UI
      if (isDone) rowEl.classList.remove('checked');
      else { rowEl.classList.add('checked'); rowEl.querySelector('.custom-check').style.color = '#fff'; }

      try {
        const r = await fetch(API + '/api/tasks/' + id + '/' + endpoint, { method: 'POST' });
        if (!r.ok) throw new Error();
        setTimeout(() => loadTasks(), 500);
      } catch (e) {
        if (isDone) rowEl.classList.add('checked');
        else rowEl.classList.remove('checked');
        toast('操作失败');
      } finally {
        toggling = false;
      }
    }

    // ===================== Delete =====================
    async function deleteTask(id) {
      if (!confirm('确定删除 #'+id+' 吗？')) return;
      try {
        const r = await fetch(API+'/api/tasks/'+id, {method:'DELETE'});
        if (!r.ok) throw new Error();
        toast('已删除');
        loadTasks();
      } catch { toast('删除失败'); }
    }

    // ===================== Modal =====================
    function openCreateModal() {
      document.getElementById('modal-title').textContent = '新建任务';
      document.getElementById('submit-btn').textContent = '创建';
      document.getElementById('task-form').reset();
      document.getElementById('task-id').value = '';
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('title').focus();
    }

    function openEditModal(id) {
      const t = tasks.find(t=>t.id===id);
      if (!t) return;
      document.getElementById('modal-title').textContent = '编辑任务';
      document.getElementById('submit-btn').textContent = '保存';
      document.getElementById('task-id').value = t.id;
      document.getElementById('title').value = t.title||'';
      document.getElementById('comment').value = t.description||'';
      document.getElementById('priority').value = t.priority||'medium';
      document.getElementById('sourceName').value = t.sourceName||'';
      if (t.deadline) {
        const d = new Date(t.deadline);
        document.getElementById('deadline').value = new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
      } else {
        document.getElementById('deadline').value = '';
      }
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('title').focus();
    }

    function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

    async function submitTask(e) {
      e.preventDefault();
      const id = document.getElementById('task-id').value;
      const title = document.getElementById('title').value.trim();
      const priority = document.getElementById('priority').value;
      const deadline = document.getElementById('deadline').value;
      const note = document.getElementById('comment').value.trim();
      const sourceName = document.getElementById('sourceName').value.trim();
      if (!title) return;

      const body = { title, priority };
      if (deadline) body.deadline = new Date(deadline).toISOString();
      if (note) body.description = note;
      if (sourceName) body.sourceName = sourceName;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = '保存中…';
      try {
        let r;
        if (id) r = await fetch(API+'/api/tasks/'+id, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        else r = await fetch(API+'/api/tasks', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if (!r.ok) throw new Error();
        toast(id?'已更新':'已创建');
        closeModal(); loadTasks();
      } catch { toast('保存失败'); }
      finally { btn.disabled = false; btn.textContent = id?'保存':'创建'; }
    }

    // ===================== Quick actions =====================
    let datePickerTaskId = null;

    function showDatePicker(id) {
      datePickerTaskId = id;
      document.getElementById('dp-backdrop').classList.add('show');
      document.getElementById('date-picker-dd').classList.add('show');
      const input = document.getElementById('date-picker-input');
      const today = new Date();
      input.value = today.toISOString().slice(0, 10);
      setTimeout(() => input.focus(), 50);
    }

    function closeDatePicker() {
      document.getElementById('dp-backdrop').classList.remove('show');
      document.getElementById('date-picker-dd').classList.remove('show');
      datePickerTaskId = null;
    }

    async function saveDatePicker() {
      const id = datePickerTaskId;
      if (!id) return;
      const val = document.getElementById('date-picker-input').value;
      if (!val) { closeDatePicker(); return; }
      const d = new Date(val + 'T23:59:59');
      try {
        const r = await fetch(API + '/api/tasks/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deadline: d.toISOString() }),
        });
        if (!r.ok) throw new Error();
        toast('截止日期已更新');
      } catch { toast('更新失败'); }
      closeDatePicker();
      loadTasks();
    }

      // Close on click outside
      const closeOnClick = e => {
        const dd = document.getElementById('date-picker-dd');
        if (dd && dd.classList.contains('show') && !dd.contains(e.target)) {
          closeDatePicker();
        }
      };
      document.addEventListener('click', closeOnClick);

    // Close date picker on overlay click
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('dp-backdrop').addEventListener('click', closeDatePicker);
    });

    async function quickAddNote(id) {
      const val = prompt('备注:');
      if (val===null) return;
      try {
        const r = await fetch(API+'/api/tasks/'+id, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:val})});
        const data = await r.json();
        if (!r.ok || data.error) throw new Error(data.error || 'fail');
        toast('备注已添加');
        loadTasks();
      } catch(e) { toast('添加失败: ' + e.message); }
    }

    // ===================== Toast =====================
    let toastTimer;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>el.classList.remove('show'), 2500);
    }

    // ===================== Keyboard =====================
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
    });

    init();
  </script>
</body>
</html>
